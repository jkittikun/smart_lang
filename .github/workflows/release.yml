name: Release

# Run from the Actions tab ("Run workflow") with a version such as 1.0.0.
# Builds a universal SmartLang.app, tags the commit vX.Y.Z and publishes a
# GitHub release with SmartLang-X.Y.Z.dmg and SmartLang-X.Y.Z.zip attached.
#
# If the release already exists, the app is rebuilt from that release's tag
# and any missing files (e.g. the .dmg) are added to it; existing files are
# left as they are.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.0 (no leading v)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists: adding missing files to it."
            echo "EXISTS=1" >> "$GITHUB_ENV"
            # Build the app exactly as it was at that release (keep today's scripts).
            git checkout "v$VERSION" -- Package.swift Sources Tests Resources
          else
            echo "EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: swift test

      - name: Build app (universal)
        run: UNIVERSAL=1 ./scripts/build_app.sh

      - name: Check app bundle
        run: |
          test -f SmartLang.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' SmartLang.app/Contents/Info.plist)" = "$VERSION"
          lipo -archs SmartLang.app/Contents/MacOS/SmartLang
          codesign --verify --deep --strict --verbose=2 SmartLang.app
          codesign --display --requirements - SmartLang.app

      - name: Zip app
        run: |
          ditto -c -k --keepParent SmartLang.app "SmartLang-$VERSION.zip"
          shasum -a 256 "SmartLang-$VERSION.zip" | tee "SmartLang-$VERSION.zip.sha256"

      - name: Make disk image
        run: |
          ./scripts/make_dmg.sh "$VERSION"
          hdiutil verify "SmartLang-$VERSION.dmg"
          shasum -a 256 "SmartLang-$VERSION.dmg" | tee "SmartLang-$VERSION.dmg.sha256"

      - name: Create release
        run: |
          cat > notes.md <<EOF
          ## SmartLang $VERSION

          A macOS menu-bar app that fixes text typed in the wrong keyboard layout
          (Thai ⇄ English), e.g. \`l;ylfu\` → \`สวัสดี\` and \`้ำสสน\` → \`hello\`.

          ### Highlights
          - Fixes words while you type, and again when you press Space, Tab or Return
          - Flip shortcut for the current word, the last word, or selected text
            (double-tap a modifier, ⇧⌫ / ⇧⌦, or your own combo); press again to flip back
          - Works with Thai Kedmanee and Pattachote and any English layout
          - Learns words you flip by hand (e.g. \`ltrko\` → \`สะพาน\`) and fixes them
            automatically next time; see and remove them in Settings → Words
          - Learns from your undo; per-app exclusions; custom Thai words
          - Sensitivity setting, sounds for fixes and flips, launch at login
          - Choice of menu-bar icon styles; the icon blinks when a word is fixed
            (choose how many times and for how long)

          ### Install
          1. Download **SmartLang-$VERSION.dmg** below and open it.
          2. Drag **SmartLang** onto the **Applications** folder, then eject the disk image.
             (Or download **SmartLang-$VERSION.zip**, unzip it, and move the app to Applications.)
          3. The app isn't notarized, so the first time macOS says it "could not verify"
             SmartLang. Click **Done**, then in System Settings → Privacy & Security
             click **Open Anyway** (or run
             \`xattr -dr com.apple.quarantine /Applications/SmartLang.app\`).
          4. Grant **Accessibility** and **Input Monitoring** in
             System Settings → Privacy & Security.

          ### Updating
          SmartLang 1.1 and later check for updates by themselves: you get a notification
          and a dot on the menu-bar icon, then choose **Update to SmartLang $VERSION…** in the
          menu (or Settings → Updates). The update is downloaded, checked, installed and
          relaunched for you, with no Gatekeeper warning and no need to run \`xattr\`.

          After each update, give SmartLang its permissions again: in System Settings →
          Privacy & Security → **Accessibility** and **Input Monitoring**, select SmartLang,
          click **−** to remove it, then allow SmartLang again when it asks. (Switching it
          off and on isn't enough, because macOS treats every new build as a new app.)

          Coming from 1.0.x? That version can't update itself: install this one by hand
          as above, then do the same permission step.

          Requires macOS 13 or later. Universal app (Apple Silicon and Intel).
          EOF
          files=("SmartLang-$VERSION.dmg" "SmartLang-$VERSION.dmg.sha256"
                 "SmartLang-$VERSION.zip" "SmartLang-$VERSION.zip.sha256")
          if [[ "$EXISTS" == "1" ]]; then
            existing="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
            for f in "${files[@]}"; do
              if grep -qxF "$f" <<<"$existing"; then
                echo "Keeping existing $f"
              else
                echo "Adding $f"
                gh release upload "v$VERSION" "$f"
              fi
            done
            gh release edit "v$VERSION" --notes-file notes.md
          else
            flags=()
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "v$VERSION" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "SmartLang $VERSION" \
              --notes-file notes.md \
              ${flags[@]+"${flags[@]}"}
          fi
